<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111318">
<title>Comando · Museu Virtual</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111318; color: #e8e8ec; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #pad { display: grid; grid-template-columns: 1fr 170px 1fr; height: 100%; gap: 10px; padding: 12px; }
  .stick { position: relative; border-radius: 18px; background: #1b1e26; display: flex; align-items: center; justify-content: center; color: #5d6373; font-size: 15px; text-align: center; }
  .base, .knob { position: absolute; border-radius: 50%; display: none; pointer-events: none; }
  .base { width: 150px; height: 150px; border: 2px solid #3a3f4d; }
  .knob { width: 66px; height: 66px; background: #4b6bfb; }
  #mid { display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  button { border: 0; border-radius: 14px; padding: 14px 6px; font: 600 16px system-ui, sans-serif; color: #fff; background: #2a2f3a; }
  button:active { filter: brightness(1.5); }
  #a { background: #2e7d32; }
  #b { background: #b3261e; }
  #status { font-size: 13px; text-align: center; color: #9aa0ad; min-height: 2.6em; }
  #status.ok { color: #7bd88f; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 9; background: #111318; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px; text-align: center; }
  #rotate .icon { font-size: 72px; line-height: 1; }
  #rotate b { font-size: 22px; }
  #rotate span { font-size: 15px; color: #9aa0ad; }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="rotate">
  <div class="icon">⟲</div>
  <b>Roda o telemóvel para a horizontal</b>
  <span>O comando só funciona com o telemóvel deitado (paisagem), segurado com as duas mãos.</span>
</div>
<div id="pad">
  <div class="stick" id="left">Andar<div class="base"></div><div class="knob"></div></div>
  <div id="mid">
    <div id="status">A ligar ao museu…</div>
    <button id="a">A · Abrir quadro</button>
    <button id="b">B · Voltar</button>
    <button id="menu">Modo RV</button>
    <button id="view">Recentrar</button>
  </div>
  <div class="stick" id="right">Olhar / virar<div class="base"></div><div class="knob"></div></div>
</div>
<script>
  // Estado enviado ao museu (RemoteServer.cs): sticks de -1 a 1; botões são contadores (cada toque soma 1).
  const st = { t: new URLSearchParams(location.search).get('t') || '', mx: 0, my: 0, lx: 0, ly: 0, a: 0, b: 0, menu: 0, view: 0 };
  const RADIUS = 70;

  function stick(id, kx, ky) {
    const el = document.getElementById(id), base = el.querySelector('.base'), knob = el.querySelector('.knob');
    let pid = null, ox = 0, oy = 0;
    const put = (n, x, y) => { n.style.display = 'block'; n.style.left = (x - n.offsetWidth / 2) + 'px'; n.style.top = (y - n.offsetHeight / 2) + 'px'; };
    el.addEventListener('pointerdown', e => {
      if (pid !== null) return;
      pid = e.pointerId; el.setPointerCapture(pid);
      const r = el.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top;
      put(base, ox, oy); put(knob, ox, oy);
    });
    el.addEventListener('pointermove', e => {
      if (e.pointerId !== pid) return;
      const r = el.getBoundingClientRect();
      let dx = e.clientX - r.left - ox, dy = e.clientY - r.top - oy;
      const d = Math.hypot(dx, dy);
      if (d > RADIUS) { dx *= RADIUS / d; dy *= RADIUS / d; }
      put(knob, ox + dx, oy + dy);
      st[kx] = dx / RADIUS; st[ky] = -dy / RADIUS;
    });
    const end = e => { if (e.pointerId !== pid) return; pid = null; base.style.display = knob.style.display = 'none'; st[kx] = st[ky] = 0; send(); };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }
  stick('left', 'mx', 'my');
  stick('right', 'lx', 'ly');

  for (const key of ['a', 'b', 'menu', 'view'])
    document.getElementById(key).addEventListener('pointerdown', () => { st[key]++; navigator.vibrate?.(15); send(); });

  // Ecrã inteiro e paisagem fixa ao primeiro toque (o Chrome só deixa bloquear a orientação em ecrã inteiro).
  document.addEventListener('pointerdown', () => {
    const d = document.documentElement;
    if (!document.fullscreenElement && d.requestFullscreen)
      d.requestFullscreen().then(() => screen.orientation?.lock?.('landscape')).catch(() => {});
  }, { once: true });

  const status = document.getElementById('status');
  const show = (text, ok) => { status.textContent = text; status.className = ok ? 'ok' : ''; };
  let busy = false;
  async function send() {
    if (busy) return;
    busy = true;
    try {
      // text/plain: pedido "simples", sem preflight.
      const r = await fetch('/input', { method: 'POST', body: JSON.stringify(st), headers: { 'Content-Type': 'text/plain' } });
      if (r.ok) show('Ligado ao museu ✓', true);
      else show(r.status === 403 ? 'Link antigo: pede um link novo no museu' : 'Erro ' + r.status, false);
    } catch (e) {
      show('À espera do museu… Abre o museu no outro telemóvel (mesma rede); liga-se sozinho.', false);
    } finally {
      busy = false;
    }
  }
  setInterval(send, 50);
</script>
</body>
</html>
